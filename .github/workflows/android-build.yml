name: Android Build & Release

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    # ⚠️ COMENTA temporalmente la validación si falla
    # - name: Validate Gradle Wrapper
    #   uses: gradle/wrapper-validation-action@v1
    
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # ⚠️ AÑADE ESTO: Verificar que existan los archivos críticos
    - name: Verify Required Files
      run: |
        echo "Verificando archivos críticos..."
        ls -la gradlew || echo "ERROR: gradlew no existe"
        ls -la gradlew.bat || echo "ERROR: gradlew.bat no existe"
        ls -la gradle/wrapper/gradle-wrapper.properties || echo "ERROR: gradle-wrapper.properties no existe"
        ls -la gradle/wrapper/gradle-wrapper.jar || echo "ERROR: gradle-wrapper.jar no existe"
        echo "Verificación completada"
    
    - name: Make gradlew executable
      run: |
        chmod +x ./gradlew || echo "No se pudo hacer ejecutable gradlew"
        ls -la gradlew
    
    - name: Cache Gradle
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace || echo "Build failed"
        echo "Build attempt completed"
    
    - name: Check if APK was generated
      run: |
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "✅ APK generado exitosamente"
          ls -la app/build/outputs/apk/debug/
        else
          echo "❌ No se generó APK"
          # Listar lo que sí hay
          find app/build -type f -name "*.apk" 2>/dev/null || echo "No hay archivos APK"
        fi
    
    - name: Upload Debug APK if exists
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: rwm-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
        retention-days: 30